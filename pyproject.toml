[project]
name = "csv-mcp"
version = "0.2.0"
description = "A safe MCP server for reading, analyzing, and editing CSV files"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3,<2",
    "langchain-mcp-adapters>=0.3,<1",
    "langchain-openai>=1.3,<2",
    "mcp>=1.27,<2",
    "pandas>=2.2,<4",
    "pydantic>=2.12,<3",
]

[project.scripts]
csv-agent = "csv_agent:main"
csv-mcp = "csv_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_agent.py", "src/csv_mcp.py"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
