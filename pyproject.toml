[project]
name = "csv-mcp"
version = "0.1.0"
description = "A small MCP server for reading and editing CSV files"
requires-python = ">=3.11"
dependencies = ["mcp>=1.27,<2", "pandas>=2.2,<4", "pydantic>=2.12,<3"]

[project.scripts]
csv-mcp = "csv_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_mcp.py"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
